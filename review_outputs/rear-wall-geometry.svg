<svg xmlns="http://www.w3.org/2000/svg" width="910" height="666" viewBox="0 0 910 666" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="910" height="666" fill="#f7f5f2"/>
<text x="70" y="38" font-size="21" font-weight="700" fill="#1d1a17">4xprerec Rev C  /  rear-left corner, top view</text>
<text x="70" y="61" font-size="13.5" fill="#6b625b">Board coordinates in mm. Enclosure features dashed. Question: is J1 crowding the corner screw post?</text>
<rect x="70.0" y="160.0" width="800.0" height="31.0" fill="#e6e0d8" stroke="#b9ab9c" stroke-width="1" stroke-dasharray="5 3"/>
<text x="690.0" y="185.0" font-size="11.5" fill="#8a7d70">1590XX rear wall (3.1 thick)</text>
<path d="M 290.0 196.0 L 870.0 196.0 L 870.0 516.0 L 170.0 516.0 L 170.0 316.0 Z" fill="#ffffff" stroke="#2f2a25" stroke-width="2.2"/>
<text x="630.0" y="476.0" font-size="12.5" fill="#9a8f84">PCB 138 x 114, 12 mm corner chamfer</text>
<circle cx="185.0" cy="211.0" r="45.0" fill="#d94f4f" fill-opacity="0.16" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
<circle cx="185.0" cy="211.0" r="3" fill="#c0392b"/>
<text x="80.0" y="144.0" font-size="12.5" font-weight="600" fill="#c0392b">6-32 corner post</text>
<text x="80.0" y="166.0" font-size="11.5" fill="#c0392b">centre (1.5, 1.5), r 4.5</text>
<line x1="230.0" y1="154.0" x2="230.0" y2="336.0" stroke="#c0392b" stroke-width="1.1" stroke-dasharray="3 3"/>
<text x="233.0" y="330.0" font-size="11" fill="#c0392b">post ends x = 6.0</text>
<rect x="300.0" y="141.0" width="90.0" height="144.0" fill="#3f7fbf" fill-opacity="0.20" stroke="#2c6ba8" stroke-width="2"/>
<text x="305.0" y="240.0" font-size="14" font-weight="700" fill="#1f5a8f">J1</text>
<text x="305.0" y="262.0" font-size="10.5" fill="#1f5a8f">9 V barrel</text>
<text x="305.0" y="278.0" font-size="10.5" fill="#1f5a8f">x 13.0 - 22.0</text>
<rect x="525.3" y="201.5" width="89.39999999999999" height="73.0" fill="#4f9d69" fill-opacity="0.20" stroke="#3a7d51" stroke-width="2"/>
<text x="530.0" y="238.0" font-size="14" font-weight="700" fill="#2f6b43">J9</text>
<text x="530.0" y="259.0" font-size="10.5" fill="#2f6b43">USB-C</text>
<rect x="400.0" y="276.0" width="470.0" height="240.0" fill="#8a6bb5" fill-opacity="0.15" stroke="#6f52a0" stroke-width="2"/>
<text x="435.0" y="312.0" font-size="13.5" font-weight="700" fill="#5a4185">MSP3526 display module</text>
<text x="435.0" y="338.0" font-size="11.5" fill="#5a4185">outline x 23 - 121, y 8 - 63.5   |   sits 11 mm above the board</text>
<text x="435.0" y="362.0" font-size="11.5" fill="#5a4185">J1 body is ~11 mm tall, so it is level with this, not under it</text>
<circle cx="430.0" cy="306.0" r="16.0" fill="#ffffff" stroke="#6f52a0" stroke-width="1.6"/>
<text x="449.0" y="292.0" font-size="10.5" fill="#5a4185">H5</text>
<line x1="230.0" y1="391.0" x2="300.0" y2="391.0" stroke="#1d1a17" stroke-width="1.6"/>
<path d="M 230.0 391.0 l 9 -5 l 0 10 Z" fill="#1d1a17"/>
<path d="M 300.0 391.0 l -9 -5 l 0 10 Z" fill="#1d1a17"/>
<line x1="300.0" y1="285.0" x2="300.0" y2="403.0" stroke="#1d1a17" stroke-width="0.9" stroke-dasharray="3 3"/>
<rect x="236.0" y="360.0" width="86" height="24" rx="4" fill="#f7f5f2"/>
<text x="265.0" y="378.0" font-size="15" font-weight="700" fill="#1d7a3e" text-anchor="middle">7.0 mm</text>
<line x1="390.0" y1="441.0" x2="400.0" y2="441.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="390.0" y1="285.0" x2="390.0" y2="453.0" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="400.0" y1="276.0" x2="400.0" y2="453.0" stroke="#c0392b" stroke-width="0.9" stroke-dasharray="3 3"/>
<line x1="395.0" y1="441.0" x2="470.0" y2="467.0" stroke="#c0392b" stroke-width="1.1"/>
<text x="476.0" y="472.0" font-size="15" font-weight="700" fill="#c0392b">1.0 mm  &#8592; the actual tight spot</text>
<line x1="70" y1="534.0" x2="870" y2="534.0" stroke="#ddd5cb" stroke-width="1.5"/>
<text x="70" y="556.0" font-size="14.5" font-weight="700" fill="#1d1a17">What the numbers say</text>
<circle cx="76" cy="575.0" r="4.5" fill="#1d7a3e"/>
<text x="90" y="580.0" font-size="13" font-weight="600" fill="#1d1a17">J1 to corner post</text>
<text x="256" y="580.0" font-size="13" fill="#4a423b">7.0 mm of clear space. The barrel is not crowding the post.</text>
<circle cx="76" cy="598.0" r="4.5" fill="#c0392b"/>
<text x="90" y="603.0" font-size="13" font-weight="600" fill="#1d1a17">J1 to display module</text>
<text x="256" y="603.0" font-size="13" fill="#4a423b">1.0 mm. This is the real constraint, and it is on the RIGHT side of J1.</text>
<circle cx="76" cy="621.0" r="4.5" fill="#c0392b"/>
<text x="90" y="626.0" font-size="13" font-weight="600" fill="#1d1a17">Move J1 right 10 mm</text>
<text x="256" y="626.0" font-size="13" fill="#4a423b">Body would land at x 23-32, straight into the display module. Blocked.</text>
<circle cx="76" cy="644.0" r="4.5" fill="#b3761f"/>
<text x="90" y="649.0" font-size="13" font-weight="600" fill="#1d1a17">Move J1 + display right</text>
<text x="256" y="649.0" font-size="13" fill="#4a423b">Works on the board, but the lid window goes visibly off-centre in the box.</text>
</svg>