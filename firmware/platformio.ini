; QuadPreRecorder firmware — Illicit Apothecary
;
; HOW TO USE THIS FILE
;   Open this folder in VS Code with the PlatformIO extension installed.
;   The blue status bar at the bottom has a project/environment picker.
;   Pick an environment, press the arrow (Upload), done.
;
;   From a terminal instead:
;     pio run -e app -t upload          <- the real firmware
;     pio run -e t01_power -t upload    <- a bring-up test
;     pio device monitor                <- watch the serial output
;
; FLASH THE BRING-UP TESTS IN ORDER (t01 .. t06) THE FIRST TIME YOU POWER A
; NEW BOARD. Each one proves a specific part of the hardware works before the
; full firmware assumes all of it does. See docs/BRINGUP.md.

[platformio]
default_envs = app
src_dir = src
; (headers live with their libraries under lib/)
lib_dir = lib

[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_unflags = -std=gnu++14 -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DUSB_SERIAL
    -DQPR_VENDOR=\"Illicit\ Apothecary\"
lib_deps =
    SdFat
    ILI9341_t3
    SPI
    Wire

; ---------------------------------------------------------------------------
; The real firmware
; ---------------------------------------------------------------------------
[env:app]
build_src_filter = +<*> -<../bringup/>

; Same firmware, but capturing four channels at 96 kHz over single-line TDM
; instead of 192 kHz over two I2S data lines. Use this if the 192 kHz dual-line
; path misbehaves on the real board.
[env:app_96k_tdm]
build_src_filter = +<*> -<../bringup/>
build_flags =
    ${env.build_flags}
    -DQPR_CAPTURE_MODE=1

; ---------------------------------------------------------------------------
; Bring-up tests. Each builds exactly one file from bringup/.
; ---------------------------------------------------------------------------
[bringup]
build_src_filter = -<*>

[env:t01_power]
build_src_filter = -<*> +<../bringup/t01_power_serial.cpp>

[env:t02_i2c]
build_src_filter = -<*> +<../bringup/t02_i2c_scan.cpp>

[env:t03_controls]
build_src_filter = -<*> +<../bringup/t03_controls.cpp>

[env:t04_sdbench]
build_src_filter = -<*> +<../bringup/t04_sd_benchmark.cpp>

[env:t05_display]
build_src_filter = -<*> +<../bringup/t05_display_touch.cpp>

[env:t06_audio]
build_src_filter = -<*> +<../bringup/t06_audio_loopback.cpp>
