  #controls button.on { background:#3d6ea5; border-color:#4d84c0; color:#fff; }
  #labels { position:absolute; inset:0; pointer-events:none; z-index:20; }
  .lbl { position:absolute; transform:translate(-50%,-50%); background:rgba(24,27,32,.92); border:1px solid #4b5563; color:#e8edf4; font-size:12px; line-height:1.25; padding:4px 8px; border-radius:5px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.5); }
  .lbl b { color:#8fc7ff; font-weight:600; }
  #leader { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:15; }
  #foot { position:absolute; bottom:12px; right:14px; color:#6b7480; font-size:11px; z-index:30; }

<script>
"use strict";
// ---------- REV D DRAFT (estimate only, no PCB behind this) ----------
// Hammond 1590D: 188 x 119.5 x 52 exterior, max PCB 178 x 110.
// Board top kept 15.5 mm below the lid underside (proven Rev C3 stack).
const HOST=document.getElementById('app');
const vw=()=>HOST.clientWidth||1, vh=()=>HOST.clientHeight||1;
const W=188.0, D=119.5, H=52.0, LID=2.5;
const BX=5.0, BY=4.75;
const BT=34.0;
const b=(x)=>x+BX, d=(y)=>y+BY;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14161a);
const camera=new THREE.PerspectiveCamera(40,vw()/vh(),1,3000);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(vw(),vh());
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
HOST.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe0ee,0x4a4640,1.25));
const key=new THREE.DirectionalLight(0xffffff,1.25);
key.position.set(180,300,240); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
const s=170; Object.assign(key.shadow.camera,{left:-s,right:s,top:s,bottom:-s,near:50,far:800});
scene.add(key);
const fill=new THREE.DirectionalLight(0x9fbcd8,0.55); fill.position.set(-200,140,-160); scene.add(fill);
const fill2=new THREE.DirectionalLight(0xd8cbb8,0.4); fill2.position.set(70,70,360); scene.add(fill2);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1100,1100),
  new THREE.ShadowMaterial({opacity:0.35}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.02; ground.receiveShadow=true; scene.add(ground);
const groundTint=new THREE.Mesh(new THREE.CircleGeometry(310,64),
  new THREE.MeshBasicMaterial({color:0x191c21}));
groundTint.rotation.x=-Math.PI/2; groundTint.position.y=-0.05; scene.add(groundTint);

const box=new THREE.Group(); scene.add(box);
const off=new THREE.Vector3(-W/2,0,-D/2);
function place(m,x,z,y){ m.position.set(x+off.x, z, y+off.z); box.add(m); return m; }

const mBody=new THREE.MeshStandardMaterial({color:0xa4aab2,metalness:0.35,roughness:0.5});
const mLid=new THREE.MeshStandardMaterial({color:0xb4bac2,metalness:0.35,roughness:0.45});
const mHole=new THREE.MeshStandardMaterial({color:0x0b0c0e,metalness:0.1,roughness:0.9});
const mPlastic=new THREE.MeshStandardMaterial({color:0x17181b,metalness:0.05,roughness:0.65});
const mSteel=new THREE.MeshStandardMaterial({color:0xc8ccd2,metalness:0.9,roughness:0.3});
const mGlass=new THREE.MeshStandardMaterial({color:0x0a1220,metalness:0.4,roughness:0.15});
const mKnob=new THREE.MeshStandardMaterial({color:0x2a2d33,metalness:0.6,roughness:0.4});
const mRed=new THREE.MeshStandardMaterial({color:0xc03030,emissive:0x500808,roughness:0.35});
const mGrn=new THREE.MeshStandardMaterial({color:0x2f9e44,emissive:0x0a3312,roughness:0.35});

const body=new THREE.Mesh(new THREE.BoxGeometry(W,H-LID,D),mBody);
body.castShadow=body.receiveShadow=true; place(body,W/2,(H-LID)/2,D/2);
const lid=new THREE.Mesh(new THREE.BoxGeometry(W-0.4,LID,D-0.4),mLid);
lid.castShadow=lid.receiveShadow=true; place(lid,W/2,H-LID/2,D/2);
const seam=new THREE.Mesh(new THREE.BoxGeometry(W+0.15,0.5,D+0.15),
  new THREE.MeshStandardMaterial({color:0x3c4046,metalness:.6,roughness:.6}));
place(seam,W/2,H-LID-0.25,D/2);
[[7,7],[181,7],[7,112.5],[181,112.5],[94,4.5],[94,115]].forEach(p=>{
  const sc=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,0.4,24),mSteel);
  place(sc,p[0],H+0.1,p[1]);
});

function wallRot(mesh,wall){
  if(wall==='rear'||wall==='front'){ mesh.rotation.x=Math.PI/2; }
  if(wall==='left'||wall==='right'){ mesh.rotation.z=Math.PI/2; }
}
function wallPos(wall,along,zc,out){
  if(wall==='rear') return [along, zc, 0-out];
  if(wall==='front') return [along, zc, D+out];
  if(wall==='left') return [0-out, zc, along];
  return [W+out, zc, along];
}
function holeCircle(wall,along,zc,rad){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,0.3,32),mHole);
  wallRot(m,wall); const p=wallPos(wall,along,zc,0.05); place(m,p[0],p[1],p[2]);
}
function holeRect(wall,along,zc,w,h,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(
    (wall==='left'||wall==='right')?0.3:w, h, (wall==='left'||wall==='right')?w:0.3),mat||mHole);
  const p=wallPos(wall,along,zc,0.05); place(m,p[0],p[1],p[2]);
}
function stubCyl(wall,along,zc,rad,len,mat){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,32),mat);
  m.castShadow=true; wallRot(m,wall);
  const p=wallPos(wall,along,zc,len/2-0.4); place(m,p[0],p[1],p[2]); return m;
}
function rj45(wall,along,zc){
  holeRect(wall,along,zc,17.0,14.2);
  const bodyM=new THREE.Mesh(new THREE.BoxGeometry(1.4,13.0,15.6),mSteel);
  place(bodyM,0.45,zc,along);
  const cav=new THREE.Mesh(new THREE.BoxGeometry(1.0,9.5,12.0),mPlastic);
  place(cav,0.35,zc-0.7,along);
}

// REAR wall
holeCircle('rear',b(20),BT+6.5,4.3);
stubCyl('rear',b(20),BT+6.5,3.1,1.9,mPlastic);
holeRect('rear',b(45),BT+1.9,13,7.5);
const usb=new THREE.Mesh(new THREE.BoxGeometry(9.2,3.4,1.2),mSteel);
{const p=wallPos('rear',b(45),BT+1.9,0.35); place(usb,p[0],p[1],p[2]);}
holeRect('rear',b(89),BT-3.4,13,3.0);
// LEFT wall: the two CAT6 mic inputs
rj45('left',d(40),BT+7.2);   // J2A ch 1-4
rj45('left',d(70),BT+7.2);   // J2B ch 5-8
// RIGHT wall
holeCircle('right',d(45),BT+3.0,3.4);
stubCyl('right',d(45),BT+3.0,2.95,0.6,mPlastic);
// FRONT wall
holeCircle('front',b(26),BT+6.3,5.6);
const nut=new THREE.Mesh(new THREE.CylinderGeometry(5.7,5.7,1.4,32),mSteel);
nut.rotation.x=Math.PI/2; {const p=wallPos('front',b(26),BT+6.3,0.7); nut.castShadow=true; place(nut,p[0],p[1],p[2]);}
stubCyl('front',b(26),BT+6.3,4.0,5.3,mSteel);
holeCircle('front',b(81),BT+6.0,1.8);
holeCircle('front',b(97),BT+6.0,1.8);
stubCyl('front',b(81),BT+6.0,1.5,1.6,mRed);
stubCyl('front',b(97),BT+6.0,1.5,1.6,mGrn);

// LID: display + controls centred on board x=89
function lidHole(x,y,rad){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,0.3,32),mHole); place(m,x,H+0.05,y); }
const win=new THREE.Mesh(new THREE.BoxGeometry(85.5,1.0,56),mGlass);
place(win,b(89),H-0.35,d(32));
const winFrame=new THREE.Mesh(new THREE.BoxGeometry(87.5,0.25,58),
  new THREE.MeshStandardMaterial({color:0x24262b,metalness:.5,roughness:.6}));
place(winFrame,b(89),H+0.03,d(32));
lidHole(b(65),d(88),1.9);
const cap2=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,2.2,24),mRed);
cap2.castShadow=true; place(cap2,b(65),H+0.9,d(88));
lidHole(b(89),d(88),3.6);
const knob=new THREE.Mesh(new THREE.CylinderGeometry(6.0,6.4,9.0,40),mKnob);
knob.castShadow=true; place(knob,b(89),H+4.5,d(88));
const knobTop=new THREE.Mesh(new THREE.CylinderGeometry(5.6,6.0,0.8,40),mSteel);
place(knobTop,b(89),H+9.0,d(88));
const mark=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.3,3.5),
  new THREE.MeshBasicMaterial({color:0xe8edf4}));
place(mark,b(89),H+9.45,d(88)-3.0);
lidHole(b(113),d(88),2.75);
const cap4=new THREE.Mesh(new THREE.CylinderGeometry(4.5,3.6,3.0,32),mPlastic);
cap4.castShadow=true; place(cap4,b(113),H+1.5,d(88));
const cap4d=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.5,20),mKnob);
place(cap4d,b(113),H+3.1,d(88));

// ---------- Illicit Apothecary logo decal on the lid (ALWAYS STAYS) ----------
// Printed between the display and the control row, centred on the board centreline.
// It reuses the header logo image (id="brandLogo") as its texture source.
const logoTex=new THREE.TextureLoader().load(document.getElementById('brandLogo').src);
logoTex.encoding=THREE.sRGBEncoding; logoTex.anisotropy=8;
const logoMat=new THREE.MeshStandardMaterial({map:logoTex,transparent:true,roughness:0.6,metalness:0.15,polygonOffset:true,polygonOffsetFactor:-1});
const LOGO_W=34, LOGO_H=34*212/360;
const logoMesh=new THREE.Mesh(new THREE.PlaneGeometry(LOGO_W,LOGO_H),logoMat);
logoMesh.rotation.x=-Math.PI/2;   // top of text toward the rear, reads correctly from the front

// ============================================================================
// OPTIONAL BRAND ART (START)
// The alchemical seal printed on the lid, left of the display, plus the
// "Art" on/off button. TO REMOVE BOTH: delete everything between
// "OPTIONAL BRAND ART (START)" and "OPTIONAL BRAND ART (END)".
// Nothing outside this block references it.
// The logo decal above is NOT part of this block; the logo always stays.
// ============================================================================
(function(){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const g=cv.getContext('2d');
  g.strokeStyle=g.fillStyle='rgba(35,38,43,0.88)';   // dark print on the aluminium lid
  g.lineWidth=9; g.lineCap='round';
  const C=256;
  g.beginPath(); g.arc(C,C,238,0,6.2832); g.stroke();            // outer ring
  g.lineWidth=5;
  g.beginPath(); g.arc(C,C,196,0,6.2832); g.stroke();            // inner ring
  const R=168, a0=-Math.PI/2, a1=a0+2.0944, a2=a0+4.1888;        // triangle
  const vx=a=>C+R*Math.cos(a), vy=a=>C+R*Math.sin(a);
  g.lineWidth=8;
  g.beginPath(); g.moveTo(vx(a0),vy(a0)); g.lineTo(vx(a1),vy(a1)); g.lineTo(vx(a2),vy(a2)); g.closePath(); g.stroke();
  g.lineWidth=6;
  g.beginPath(); g.moveTo(C-108,C+34); g.lineTo(C+108,C+34); g.stroke();   // bar
  [a0,a1,a2].forEach(a=>{ g.beginPath(); g.arc(vx(a),vy(a),11,0,6.2832); g.fill(); });
  g.beginPath(); g.arc(C,C+8,46,0,6.2832); g.fill();             // crescent = disc...
  g.globalCompositeOperation='destination-out';
  g.beginPath(); g.arc(C+22,C-2,42,0,6.2832); g.fill();          // ...minus offset disc
  g.globalCompositeOperation='source-over';
  g.lineWidth=5;
  [[C,6,C,34],[C,478,C,506],[6,C,34,C],[478,C,506,C]].forEach(t=>{ // compass ticks
    g.beginPath(); g.moveTo(t[0],t[1]); g.lineTo(t[2],t[3]); g.stroke(); });
  const sealTex=new THREE.CanvasTexture(cv); sealTex.anisotropy=8;
  const sealMat=new THREE.MeshStandardMaterial({map:sealTex,transparent:true,roughness:0.6,metalness:0.15,polygonOffset:true,polygonOffsetFactor:-1});
  const sealMesh=new THREE.Mesh(new THREE.PlaneGeometry(30,30),sealMat);
  sealMesh.rotation.x=-Math.PI/2;
  place(sealMesh,b(23),H+0.08,d(32));
  const ctr=document.getElementById('controls');
  const btn=document.createElement('button');
  btn.id='artBtn'; btn.textContent='Art'; btn.className='on';
  btn.addEventListener('click',()=>{ sealMesh.visible=!sealMesh.visible; btn.classList.toggle('on',sealMesh.visible); });
  ctr.appendChild(btn);
})();
// ============================================================================
// OPTIONAL BRAND ART (END)
// ============================================================================

// labels
const N={rear:[0,0,-1],front:[0,0,1],left:[-1,0,0],right:[1,0,0],lid:[0,1,0]};
const LBL=[
 {t:"<b>J1</b> 9 V DC input (barrel jack)", n:'rear', p:[b(20)-18,8,-26], a:[b(20),BT+6.5,0]},
 {t:"<b>J9</b> USB-C (charge + data)", n:'rear', p:[b(45)+6,BT-24,-28], a:[b(45),BT+1.9,0]},
 {t:"<b>SD</b> micro-SD slot (Teensy 4.1)", n:'rear', p:[b(89)+38,BT+11,-26], a:[b(89),BT-3.4,0]},
 {t:"<b>J2A</b> CAT6 mic input, ch 1-4", n:'left', p:[-34,BT+22,d(40)-6], a:[0,BT+7.2,d(40)]},
 {t:"<b>J2B</b> CAT6 mic input, ch 5-8", n:'left', p:[-36,BT-16,d(70)+12], a:[0,BT+7.2,d(70)]},
 {t:"<b>J5</b> 3.5 mm headphone out", n:'right', p:[W+34,BT+20,d(45)], a:[W,BT+3.0,d(45)]},
 {t:"<b>J4</b> 1/4 in line out (Neutrik)", n:'front', p:[b(26)-18,BT+28,D+20], a:[b(26),BT+6.3,D+5]},
 {t:"<b>D4/D5</b> status LEDs", n:'front', p:[b(89),BT-16,D+22], a:[b(89),BT+6.0,D]},
 {t:"<b>SW2</b> Record (centred row)", n:'lid', p:[b(40),H+22,d(108)], a:[b(65),H+2,d(88)]},
 {t:"<b>SW3</b> Encoder, on centreline", n:'lid', p:[b(89),H+26,d(112)], a:[b(89),H+10,d(88)]},
 {t:"<b>SW4</b> 5-way nav (centred row)", n:'lid', p:[b(140),H+22,d(108)], a:[b(113),H+3.5,d(88)]},
 {t:"<b>TFT</b> 3.5 in touch display, centred", n:'lid', p:[b(120),H+18,d(2)], a:[b(102),H,d(26)]},
];
const labelHost=document.getElementById('labels');
const svg=document.getElementById('leader');
const labelObjs=LBL.map(L=>{
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML=L.t; labelHost.appendChild(el);
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('stroke','#7a879a'); line.setAttribute('stroke-width','1.2');
  svg.appendChild(line);
  const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
  dot.setAttribute('r','2.4'); dot.setAttribute('fill','#8fc7ff'); svg.appendChild(dot);
  return {el,line,dot,n:new THREE.Vector3(...N[L.n]),
    p:new THREE.Vector3(L.p[0]+off.x,L.p[1],L.p[2]+off.z),
    a:new THREE.Vector3(L.a[0]+off.x,L.a[1],L.a[2]+off.z)};
});
let showLabels=true;
function proj(v){
  const w=v.clone().project(camera);
  return {x:(w.x*0.5+0.5)*vw(), y:(-w.y*0.5+0.5)*vh(), z:w.z};
}
function updateLabels(){
  svg.setAttribute('viewBox','0 0 '+vw()+' '+vh());
  labelObjs.forEach(o=>{
    const view=camera.position.clone().sub(o.a).normalize();
    const facing=o.n.dot(view)>0.30;
    const sp=proj(o.p), sa=proj(o.a);
    const onscreen=sp.z<1&&sa.z<1;
    const show=showLabels&&onscreen&&facing;
    o.el.style.display=show?'block':'none';
    o.line.style.display=show?'':'none';
    o.dot.style.display=show?'':'none';
    if(!show)return;
    o.el.style.left=sp.x+'px'; o.el.style.top=sp.y+'px';
    o.line.setAttribute('x1',sp.x); o.line.setAttribute('y1',sp.y);
    o.line.setAttribute('x2',sa.x); o.line.setAttribute('y2',sa.y);
    o.dot.setAttribute('cx',sa.x); o.dot.setAttribute('cy',sa.y);
  });
}

// camera
let theta=-0.6, phi=1.12, dist=400, target=new THREE.Vector3(0,20,0);
function applyCam(){
  camera.position.set(
    target.x+dist*Math.sin(phi)*Math.sin(theta),
    target.y+dist*Math.cos(phi),
    target.z+dist*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(target);
}
let drag=false,px=0,py=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;spin=false;spinBtn.classList.remove('on');});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{
  if(!drag)return;
  theta-=(e.clientX-px)*0.006; phi-=(e.clientY-py)*0.006;
  phi=Math.max(0.08,Math.min(Math.PI-0.08,phi)); px=e.clientX;py=e.clientY;
});
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  dist=Math.max(140,Math.min(1000,dist*(1+e.deltaY*0.001)));
},{passive:false});

const VIEWS={
  isoF:{theta:0.55,phi:1.08,dist:400},
  isoR:{theta:Math.PI+0.7,phi:1.05,dist:400},
  top:{theta:0,phi:0.09,dist:370},
  front:{theta:0,phi:1.35,dist:390},
  rear:{theta:Math.PI,phi:1.35,dist:390},
  left:{theta:-Math.PI/2,phi:1.30,dist:390},
  right:{theta:Math.PI/2,phi:1.30,dist:390},
};
document.querySelectorAll('#controls button[data-view]').forEach(btn=>{
  btn.addEventListener('click',()=>{const v=VIEWS[btn.dataset.view]; theta=v.theta;phi=v.phi;dist=v.dist;spin=false;spinBtn.classList.remove('on');});
});
window.setView=(name)=>{const v=VIEWS[name]; theta=v.theta;phi=v.phi;dist=v.dist;spin=false;};
const lblBtn=document.getElementById('lblBtn');
lblBtn.addEventListener('click',()=>{showLabels=!showLabels;lblBtn.classList.toggle('on',showLabels);});
let spin=false;
const spinBtn=document.getElementById('spinBtn');
spinBtn.addEventListener('click',()=>{spin=!spin;spinBtn.classList.toggle('on',spin);});

function onResize(){
  camera.aspect=vw()/vh(); camera.updateProjectionMatrix();
  renderer.setSize(vw(),vh());
}
new ResizeObserver(onResize).observe(HOST);
addEventListener('resize',onResize);
(function loop(){
  requestAnimationFrame(loop);
  if(spin)theta+=0.004;
  applyCam(); renderer.render(scene,camera); updateLabels();
})();
window.__ready=true;

</script>
